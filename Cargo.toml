[package]
name = "Scriptpendra"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["file", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "async-secret-service", "async-io", "crypto-rust"] }
krilla = "0.8.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json", "platform-verifier"] }

[build-dependencies]
embed-resource = "3"
